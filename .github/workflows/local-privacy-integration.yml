name: Local privacy integration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/check-release-invariants.mjs"
      - "package.json"
      - ".github/workflows/local-privacy-integration.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/check-release-invariants.mjs"
      - "package.json"
      - ".github/workflows/local-privacy-integration.yml"

permissions:
  contents: read

jobs:
  privacy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release invariants
        run: npm run test:release

      - name: Build frontend
        run: npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test bounded request bodies and retry-safe account deletion
        run: >-
          deno test
          supabase/functions/_shared/request-body.test.ts
          supabase/functions/_shared/account-deletion.test.ts

      - name: Type-check security-sensitive Edge Functions
        run: >-
          deno check --node-modules-dir=auto
          supabase/functions/register-esports/index.ts
          supabase/functions/request-consultation/index.ts
          supabase/functions/view-payment-evidence/index.ts
          supabase/functions/delete-account/index.ts
          supabase/functions/manage-user-accounts/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.9.8

      - name: Start isolated local Supabase stack
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy

      - name: Apply repository migrations to local database
        run: supabase db reset --local

      - name: Run two-organizer privacy integration tests
        run: supabase test db
