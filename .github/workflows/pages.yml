name: Build Company-001

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-001-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: company-001-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
