name: Build Company-001

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-001-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Smoke-test consultation endpoint (no database write)
        env:
          CONSULTATION_URL: https://zkzgkovwktljfuuuhivk.supabase.co/functions/v1/request-consultation
          SITE_ORIGIN: https://company-001.pages.dev
          SUPABASE_PUBLISHABLE_KEY: sb_publishable__hHhbTYbvfL3TPa-_JHxQQ_EI9A_kTB
        run: |
          set -euo pipefail
          preflight_code="$(curl --silent --show-error --output /tmp/consultation-preflight.txt --write-out '%{http_code}' --request OPTIONS "$CONSULTATION_URL" --header "Origin: $SITE_ORIGIN" --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: apikey,content-type')"
          test "$preflight_code" = "204"
          grep -qi "access-control-allow-origin: $SITE_ORIGIN" /tmp/consultation-preflight.txt
          invalid_code="$(curl --silent --show-error --output /tmp/consultation-invalid.json --write-out '%{http_code}' --request POST "$CONSULTATION_URL" --header "Origin: $SITE_ORIGIN" --header "apikey: $SUPABASE_PUBLISHABLE_KEY" --header 'Content-Type: application/json' --data '{"name":"x","email":"invalid","project_type":"unknown","requirements":"short"}')"
          test "$invalid_code" = "400"
          echo "Consultation endpoint is reachable, CORS preflight works, and invalid input is rejected without creating a row."
      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: company-001-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
